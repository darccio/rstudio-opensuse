name: Recipe checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tumbleweed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: registry.opensuse.org/opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install recipe check dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            ca-certificates git make gcc gcc-c++ cmake ninja rpm-build cpio tar gzip \
            /usr/bin/python3 /usr/bin/node npm24 reuse
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check licensing and build-recipe fixtures
        run: make check
